services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zomato
      POSTGRES_USER: zomato
      POSTGRES_PASSWORD: zomato
    ports:
      - "5432:5432"
    volumes:
      - zomato_pg:/var/lib/postgresql/data

  dashboard:
    build: .
    depends_on:
      - postgres
    ports:
      - "8501:8501"
    volumes:
      - .:/app

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  zomato_pg:
